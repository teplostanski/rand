<p>Randomness. On demand.</p>
</main>
<script>
let seed = 2317;
function random() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
const symbols = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz{}[]<>/+=*#%&?";
const rain = document.querySelector(".rain");
for (let i = 0; i < 44; i++) {
  const column = document.createElement("div");
  column.className = "column";
  column.style.left = `${i * 28 - 8}px`;
  column.style.top = `${-random() * 120}px`;
  const gray = Math.floor(65 + random() * 65);
  column.style.color = `rgb(${gray}, ${gray}, ${gray})`;
  column.textContent = Array.from({ length: 28 }, () => random() < 0.16 ? " " : symbols[Math.floor(random() * symbols.length)]).join("\n");
  rain.append(column);
}
</script>
