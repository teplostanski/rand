name: rand

services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the published image tag}
    ports:
      - "127.0.0.1:${HOST_PORT:-3001}:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      TRUST_PROXY: ${TRUST_PROXY:?Set TRUST_PROXY in the VPS .env file}
      NODE_OPTIONS: "--max-old-space-size=64"
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    dns:
      - 127.0.0.1
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s

networks:
  default:
    external: true
    name: rand_default
